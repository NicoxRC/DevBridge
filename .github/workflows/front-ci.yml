name: front-ci

on:
  pull_request:
    branches: [trunk]
    paths:
      - 'frontend/**'
      - '.github/workflows/front-ci.yml'
  push:
    branches: [trunk]
    paths:
      - 'frontend/**'
      - '.github/workflows/front-ci.yml'

concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: front-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: front-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
